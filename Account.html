<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Account | मोरया मोबाईल</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 2rem auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      padding: 2rem;
    }

    h2 {
      text-align: center;
      color: #d90429;
      margin-bottom: 2rem;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .menu a {
      text-decoration: none;
      color: #333;
      padding: 1rem;
      border-radius: 8px;
      background: #f8f8f8;
      transition: 0.2s ease;
      font-weight: 500;
    }

    .menu a:hover {
      background: #d90429;
      color: #fff;
    }

    .logout {
      margin-top: 2rem;
      background: #d90429;
      color: white;
      text-align: center;
      padding: 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      display: block;
    }

    .logout:hover {
      background: #a0031f;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>My Account</h2>
  <div class="menu">
    <a href="orders.html">🛍️ My Orders</a>
    <a href="wishlist.html">❤️ Wishlist</a>
    <a href="help.html">🆘 Help Center</a>
    <a href="language.html">🌐 Language</a>
    <a href="edit-profile.html">✏️ Edit Profile</a>
    <a href="addresses.html">🏠 Saved Addresses</a>
  </div>

  <a href="login.html" onclick="logout()" class="logout">🚪 Log Out</a>
</div>

<script>
  const loggedIn = localStorage.getItem('loggedIn');
  if (loggedIn !== 'true') {
    window.location.href = 'login.html';
  }

  function logout() {
    localStorage.removeItem('loggedIn');
    localStorage.removeItem('user');
  }
</script>

</body>
</html>
