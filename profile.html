<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile | मोरया मोबाईल</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .profile-container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
    }

    h2 {
      text-align: center;
      color: #d90429;
    }

    .info {
      margin: 1rem 0;
    }

    .info label {
      font-weight: bold;
    }

    .info p {
      margin: 0.3rem 0 1rem;
    }

    button {
      background: #d90429;
      color: white;
      border: none;
      padding: 0.6rem 1rem;
      margin-top: 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    form {
      margin-top: 1rem;
      display: none;
    }

    form input {
      width: 100%;
      padding: 0.6rem;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .message {
      color: green;
      font-size: 0.9rem;
      display: none;
      margin-top: 10px;
    }

    .error {
      color: red;
      font-size: 0.9rem;
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="profile-container">
  <h2>Welcome, <span id="userName"></span>!</h2>

  <div class="info">
    <label>Name:</label>
    <p id="displayName"></p>

    <label>Email:</label>
    <p id="displayEmail"></p>
  </div>

  <button onclick="toggleEditForm()">Edit Profile</button>
  <button onclick="togglePasswordForm()">Change Password</button>
  <button onclick="logout()">Logout</button>

  <!-- Edit Profile Form -->
  <form id="editForm">
    <input type="text" id="editName" placeholder="New Name">
    <input type="email" id="editEmail" placeholder="New Email">
    <button type="button" onclick="updateProfile()">Save Changes</button>
    <p class="message" id="editSuccess">Profile updated successfully!</p>
  </form>

  <!-- Change Password Form -->
  <form id="passwordForm">
    <input type="password" id="newPassword" placeholder="New Password">
    <input type="password" id="confirmPassword" placeholder="Confirm Password">
    <button type="button" onclick="changePassword()">Update Password</button>
    <p class="message" id="passwordSuccess">Password changed successfully!</p>
    <p class="error" id="passwordError">Passwords do not match!</p>
  </form>
</div>

<script>
  const user = JSON.parse(localStorage.getItem('user'));
  const loggedIn = localStorage.getItem('loggedIn');

  if (!user || loggedIn !== 'true') {
    window.location.href = 'login.html';
  }

  // Display user info
  document.getElementById('userName').textContent = user.name;
  document.getElementById('displayName').textContent = user.name;
  document.getElementById('displayEmail').textContent = user.email;

  // Toggle forms
  function toggleEditForm() {
    document.getElementById('editForm').style.display =
      document.getElementById('editForm').style.display === 'block' ? 'none' : 'block';
    document.getElementById('passwordForm').style.display = 'none';
  }

  function togglePasswordForm() {
    document.getElementById('passwordForm').style.display =
      document.getElementById('passwordForm').style.display === 'block' ? 'none' : 'block';
    document.getElementById('editForm').style.display = 'none';
  }

  // Update name/email
  function updateProfile() {
    const newName = document.getElementById('editName').value.trim();
    const newEmail = document.getElementById('editEmail').value.trim();

    if (newName) user.name = newName;
    if (newEmail) user.email = newEmail;

    localStorage.setItem('user', JSON.stringify(user));

    // Update display
    document.getElementById('userName').textContent = user.name;
    document.getElementById('displayName').textContent = user.name;
    document.getElementById('displayEmail').textContent = user.email;

    document.getElementById('editSuccess').style.display = 'block';
    setTimeout(() => {
      document.getElementById('editSuccess').style.display = 'none';
      document.getElementById('editForm').style.display = 'none';
    }, 2000);
  }

  // Change password
  function changePassword() {
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword || newPassword === '') {
      document.getElementById('passwordError').style.display = 'block';
      return;
    }

    user.password = newPassword;
    localStorage.setItem('user', JSON.stringify(user));
    document.getElementById('passwordError').style.display = 'none';
    document.getElementById('passwordSuccess').style.display = 'block';

    setTimeout(() => {
      document.getElementById('passwordSuccess').style.display = 'none';
      document.getElementById('passwordForm').style.display = 'none';
    }, 2000);
  }

  // Logout
  function logout() {
    localStorage.removeItem('loggedIn');
    window.location.href = 'login.html';
  }
</script>

</body>
</html>
